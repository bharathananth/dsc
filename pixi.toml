[workspace]
authors = ["Bharath Air <bharath.ananthsub@gmail.com>"]
channels = ["conda-forge"]
name = "dsc"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
dsc = {path = ".", editable = true}
h5py = "*"
msgpack-python = "*"
numexpr = "*"
numpy = ">=1.16.2"
pandas = ">=0.24.2"
ptable = "*"
pyarrow = ">=0.5.0"
sqlalchemy = "*"
sympy = "*"
tzlocal = "*"
sos = { git = "https://github.com/vatlab/sos.git" }
sos-pbs = { git = "https://github.com/vatlab/sos-pbs.git" }
